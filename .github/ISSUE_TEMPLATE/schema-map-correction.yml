name: Schema map correction
description: A schema map shows something that differs from the specification.
title: "[Schema map] "
labels: ["schema-map-correction"]
body:
  - type: markdown
    attributes:
      value: |
        Schema maps are unofficial. If a map and the published specification disagree, the specification is right. Pre-release maps (for example version 1.5) are candidates and may change.
  - type: dropdown
    id: version
    attributes:
      label: Specification version
      description: The version the map is meant to show.
      options:
        - "1.0"
        - "1.1"
        - "1.2"
        - "1.3"
        - "1.4"
        - "1.5 (candidate / pre-release)"
        - Other
    validations:
      required: true
  - type: input
    id: map
    attributes:
      label: Schema map file or page
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What the map shows
      description: Name the column, dataset, or relationship.
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: What the specification shows
      description: Link or quote the specification text.
    validations:
      required: true
